services:
  lirium:
    image: rodoagosto/lirium-nutrition-planning:latest
    # Imagen publicada en Docker Hub -- sin build, listo para levantar.
    # Para buildear localmente desde el código en vez de usar la imagen,
    # comentá la línea de arriba y descomentá esta:
    # build: .
    ports:
      - "8080:8080"
    environment:
      # -----------------------------------------------------------------
      # Valores DEMO, no secretos. Se commitean a propósito para que
      # `docker compose up` funcione sin configuración extra -- cero
      # fricción para probar el proyecto local. En el deploy real
      # (Render) estas mismas variables son secretos reales, gestionados
      # por la plataforma, nunca commiteados al repo.
      # -----------------------------------------------------------------
      DB_URL: jdbc:postgresql://postgres:5432/lirium-demo
      DB_USER_NAME: postgres
      DB_PASSWORD: postgres-demo
      JWT_SECRET: this-is-a-public-demo-jwt-secret-only-for-local-docker-compose-never-use-in-prod
      # Google OAuth2 no se puede probar en este entorno -- credenciales
      # reales de Google no se commitean nunca. El login OAuth2 real
      # se prueba en la demo online (ver README).
      GOOGLE_CLIENT_ID: fake-client-id-for-local-demo
      GOOGLE_CLIENT_SECRET: fake-client-secret-for-local-demo
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lirium-demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-demo
    ports:
      - "5432:5432"
      # Volumen persistente deshabilitado intencionalmente:
      # este Compose está pensado como entorno DEMO reproducible.
      # PostgreSQL se inicializa desde cero al crear el contenedor.
      # volumes:
      #   - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lirium-demo"]
      interval: 10s
      timeout: 5s
      retries: 5

# Volumen persistente no utilizado en el entorno DEMO.
# volumes:
#   postgres_data: