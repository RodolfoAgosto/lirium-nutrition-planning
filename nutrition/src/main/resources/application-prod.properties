spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

app.jwt.secret=${JWT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ---------------------------
# CORS
# No default here on purpose: until you deploy a frontend, this stays
# empty and nothing cross-origin is allowed (Swagger/Postman unaffected,
# they don't go through CORS). When you deploy the frontend, set
# CORS_ALLOWED_ORIGINS in Render's dashboard — no code change needed.
# ---------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}