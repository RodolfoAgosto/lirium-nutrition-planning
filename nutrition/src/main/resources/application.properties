# ---------------------------
# CONFIGURACION DEL SERVIDOR
# ---------------------------
server.port=8080

# ---------------------------
# CONFIGURACION JPA / HIBERNATE
# ---------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CLAVE: con Flyway activo, Hibernate NUNCA debe crear/alterar el esquema.
# 'validate' hace que Hibernate solo confirme que las entidades coinciden
# con lo que Flyway ya aplicó. Si esto quedara en 'create' o 'update',
# Hibernate compite con Flyway y falla con "relation already exists".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------
# DATA SOURCE (PostgreSQL)
# ---------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/lirium
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------
# FLYWAY
# ---------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------
# PROFILE ACTIVO
# ---------------------------
# En CI/CD esto se sobreescribe con -Dspring.profiles.active=test
# (ver application-test.properties), nunca se deja "dev" fijo en el
# pipeline.
spring.profiles.active=dev

# ---------------------------
# JWT
# ---------------------------
app.jwt.secret=${JWT_SECRET:esta-es-una-clave-secreta-muy-larga-y-segura-para-desarrollo-32-chars}
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# ---------------------------
# OAUTH2 (Google)
# ---------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile