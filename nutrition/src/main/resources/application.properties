# ---------------------------
# CONFIGURACION DEL SERVIDOR
# ---------------------------
server.port=8080

# ---------------------------
# CONFIGURACION JPA / HIBERNATE
# ---------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CLAVE: con Flyway activo, Hibernate NUNCA debe crear/alterar el esquema.
# 'validate' hace que Hibernate solo confirme que las entidades coinciden
# con lo que Flyway ya aplicó. Si esto quedara en 'create' o 'update',
# Hibernate compite con Flyway y falla con "relation already exists".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------
# DATA SOURCE (PostgreSQL)
# ---------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------
# FLYWAY
# ---------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------
# JWT
# ---------------------------
 app.jwt.secret=${JWT_SECRET}
 app.jwt.expiration=28800000
 app.jwt.refresh-expiration=604800000

# ---------------------------
# OAUTH2 (Google)
# ---------------------------
 spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
 spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
 spring.security.oauth2.client.registration.google.scope=email,profile

# ---------------------------
# SWAGGER
# ---------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha