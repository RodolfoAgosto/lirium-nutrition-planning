# ---------------------------
# application-test.properties
# Se activa con @ActiveProfiles("test") o -Dspring.profiles.active=test
# Pensado para tests con @SpringBootTest / NutritionApplicationTest.
# Si tu AbstractIntegrationTest ya usa Testcontainers, ese Testcontainer
# sobreescribe datasource.url/username/password en runtime via
# @DynamicPropertySource -- este archivo cubre el caso de tests que NO
# usan Testcontainers y solo necesitan que el contexto levante rápido.
# ---------------------------

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Evita que el contexto de test intente resolver credenciales reales
# de Google OAuth2 que no existen en CI.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

app.jwt.secret=test-secret-key-not-for-production-use-only-32-chars
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000
