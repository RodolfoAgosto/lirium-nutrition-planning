# ===================================================================
# CONFIGURACIÓN DE TEST (H2 en memoria)
# Ubicación: src/test/resources/application-test.properties
# ===================================================================

# --- BASE DE DATOS ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# --- MIGRACIONES Y ESTRUCTURA ---
# Se desactiva Flyway para evitar que ejecute scripts de Postgres en H2
spring.flyway.enabled=false
# Hibernate genera automáticamente la estructura de la base según tus Entidades
spring.jpa.hibernate.ddl-auto=create-drop

# --- SEGURIDAD: JWT ---
app.jwt.secret=mi-super-secret-key-ultra-larga-123456789012345678901234567890
app.jwt.expiration=900000
app.jwt.refresh-expiration=604800000

# --- SEGURIDAD: OAUTH2 GOOGLE (Mock) ---
spring.security.oauth2.client.registration.google.client-id=mock-id
spring.security.oauth2.client.registration.google.client-secret=mock-secret
spring.security.oauth2.client.registration.google.scope=email,profile