name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutrition
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # mvn verify runs everything: unit tests (Surefire), integration tests
      # (Failsafe, Testcontainers with PostgreSQL) and the three JaCoCo reports
      # (unit, integration, merged). The Sonar step waits for the Quality Gate
      # and fails the build if it doesn't pass.
      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=RodolfoAgosto_lirium-nutrition-planning
          -Dsonar.qualitygate.wait=true

      - name: Upload JaCoCo unit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit-report
          path: target/site/jacoco

      - name: Upload JaCoCo integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-integration-report
          path: target/site/jacoco-integration

      - name: Upload JaCoCo merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-merged-report
          path: target/site/jacoco-merged

  # Checks code formatting and that the Flyway migrations apply cleanly on a
  # real PostgreSQL (a GitHub Actions service container, not Testcontainers).
  # The deploy waits for this job.
  flyway-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutrition
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lirium
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Check code formatting
        run: mvn spotless:check
      - name: Verify Flyway migrations apply cleanly
        run: >
          mvn flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/lirium
          -Dflyway.user=postgres
          -Dflyway.password=postgres
          -Dflyway.locations=classpath:db/migration

  docker-publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, flyway-check]

    # Only publish on pushes to main, never on pull_request events -- a PR
    # build reaching this job would otherwise overwrite the :latest image
    # in Docker Hub with unmerged code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nutrition
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lirium-nutrition-planning:latest
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"